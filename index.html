<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-image: url('https://dxbapps.com/blogimages/eventbrite.jpg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      min-height: 100vh;
      transition: background-color 0.3s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      color: #fff;
    }

    body.dark::before {
      background-color: rgba(0, 0, 0, 0.7);
    }

    body.dark .glass-card {
      background: rgba(30, 30, 30, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f0f0f0;
    }

    body.dark input,
    body.dark textarea {
      background-color: #2a2a2a;
      color: #f0f0f0;
      border: 1px solid #555;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-3xl font-bold text-white">🎉 Event Manager</h1>
      <button id="toggleTheme" class="btn btn-secondary">🌙 Dark Mode</button>
    </div>

    <!-- Event Form -->
    <form id="eventForm" class="glass-card p-4 mb-4">
      <input type="text" id="title" placeholder="Event Title" class="form-control mb-2" required />
      <textarea id="description" placeholder="Description" class="form-control mb-2"></textarea>
      <input type="datetime-local" id="date" class="form-control mb-2" required />
      <input type="text" id="invitees" placeholder="Invitee emails (comma-separated)" class="form-control mb-2" />
      <button type="submit" class="btn btn-primary w-full">Create Event</button>
    </form>

    <!-- Search -->
    <input type="text" id="search" placeholder="Search events..." class="form-control mb-3" />

    <!-- Events Section -->
    <h2 class="text-2xl font-semibold text-white mb-3">📅 Events Added</h2>
    <div id="eventList" class="row row-cols-1 row-cols-md-2 g-4"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
